<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Hong Kong compact one-bedroom flat</title>
  <desc id="desc">Original architectural-style plan of a compact Hong Kong one-bedroom apartment.</desc>
  <defs>
    <style>
      .outer{fill:#111}.inner{fill:#444}.cut{fill:#fff}.thin{fill:none;stroke:#666;stroke-width:3}.fixture{fill:none;stroke:#777;stroke-width:2}.label{font:600 17px Arial,sans-serif;fill:#222;letter-spacing:.7px;paint-order:stroke;stroke:#fff;stroke-width:6px}.sub{font:12px Arial,sans-serif;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px}.dim{font:11px Arial,sans-serif;fill:#666}.door{fill:none;stroke:#666;stroke-width:2}.glass{stroke:#555;stroke-width:3}.zone{fill:#000;opacity:.018}.column{fill:#666}
    </style>
  </defs>
  <rect width="1000" height="700" fill="#fff"/>
  <rect x="82" y="54" width="836" height="592" class="outer"/>
  <rect x="98" y="70" width="804" height="560" class="cut"/>
  <!-- internal partitions -->
  <rect x="98" y="70" width="288" height="268" class="inner"/><rect x="112" y="84" width="260" height="240" class="cut"/>
  <rect x="98" y="338" width="288" height="14" class="inner"/>
  <rect x="386" y="70" width="14" height="282" class="inner"/>
  <rect x="646" y="70" width="14" height="246" class="inner"/>
  <rect x="646" y="302" width="256" height="14" class="inner"/>
  <rect x="734" y="70" width="14" height="246" class="inner"/>
  <!-- openings cut through partitions -->
  <rect x="386" y="250" width="14" height="68" class="cut"/>
  <rect x="646" y="218" width="14" height="70" class="cut"/>
  <rect x="734" y="218" width="14" height="70" class="cut"/>
  <!-- entrance -->
  <rect x="82" y="480" width="16" height="88" class="cut"/>
  <path d="M98 568V480A88 88 0 0 1 186 568" class="door"/><line x1="98" y1="568" x2="186" y2="568" class="door"/>
  <!-- internal door swings -->
  <path d="M400 318V250A68 68 0 0 1 468 318" class="door"/><line x1="400" y1="318" x2="468" y2="318" class="door"/>
  <path d="M660 288V218A70 70 0 0 1 730 288" class="door"/><line x1="660" y1="288" x2="730" y2="288" class="door"/>
  <path d="M748 288V218A70 70 0 0 1 818 288" class="door"/><line x1="748" y1="288" x2="818" y2="288" class="door"/>
  <!-- windows -->
  <rect x="478" y="54" width="132" height="16" class="cut"/><line x1="486" y1="60" x2="602" y2="60" class="glass"/><line x1="486" y1="66" x2="602" y2="66" class="glass"/>
  <rect x="716" y="630" width="150" height="16" class="cut"/><line x1="724" y1="634" x2="858" y2="634" class="glass"/><line x1="724" y1="641" x2="858" y2="641" class="glass"/>
  <!-- kitchen fixtures -->
  <rect x="112" y="84" width="70" height="226" class="fixture"/><rect x="116" y="94" width="62" height="58" class="fixture"/>
  <circle cx="147" cy="123" r="17" class="fixture"/><rect x="116" y="166" width="62" height="60" class="fixture"/><circle cx="137" cy="186" r="11" class="fixture"/><circle cx="158" cy="206" r="11" class="fixture"/>
  <rect x="278" y="84" width="80" height="68" class="fixture"/><path d="M286 92h64v52h-64zM286 92l64 52M350 92l-64 52" class="fixture"/>
  <!-- bathroom fixtures -->
  <rect x="674" y="84" width="44" height="62" rx="18" class="fixture"/><ellipse cx="696" cy="111" rx="14" ry="20" class="fixture"/>
  <rect x="756" y="84" width="132" height="72" class="fixture"/><path d="M764 92h116v56M764 148l116-56" class="fixture"/>
  <rect x="674" y="170" width="52" height="34" rx="5" class="fixture"/><ellipse cx="700" cy="187" rx="15" ry="9" class="fixture"/>
  <!-- subtle living zone and structure -->
  <rect x="412" y="332" width="472" height="280" rx="3" class="zone"/><rect x="98" y="338" width="34" height="34" class="column"/><rect x="868" y="302" width="34" height="34" class="column"/>
  <!-- labels -->
  <text x="242" y="256" text-anchor="middle" class="label">OPEN KITCHEN</text><text x="242" y="276" text-anchor="middle" class="sub">2.6 × 2.4 m</text>
  <text x="530" y="180" text-anchor="middle" class="label">BEDROOM</text><text x="530" y="200" text-anchor="middle" class="sub">2.5 × 2.3 m</text>
  <text x="820" y="188" text-anchor="middle" class="label">BATHROOM</text><text x="820" y="210" text-anchor="middle" class="sub">2.4 × 2.2 m</text>
  <text x="628" y="464" text-anchor="middle" class="label">LIVING / DINING</text><text x="628" y="484" text-anchor="middle" class="sub">4.9 × 2.8 m</text>
  <text x="205" y="592" class="sub">ENTRANCE</text>
  <!-- scale bar -->
  <g transform="translate(724 674)"><text x="0" y="-8" class="dim">0</text><text x="50" y="-8" class="dim">1</text><text x="100" y="-8" class="dim">2 m</text><path d="M0 0h100M0-5v10M50-5v10M100-5v10" class="thin"/></g>
  <text x="98" y="674" class="dim">HK COMPACT 1-BEDROOM · APPROX. 35 m²</text>
</svg>
